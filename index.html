
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under 25 | Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .card {
      max-width: 480px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0002;
      text-align: center;
    }

    h1 { margin: 5px 0; }
    .subtitle { color: #6b7280; margin-bottom: 20px; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input { border: 1px solid #d1d5db; }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .secondary { background: #4b5563; }

    #reader { width: 100%; margin: 15px auto; }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success { display: block !important; background: #dcfce7; color: #166534; }
    .error { display: block !important; background: #fee2e2; color: #991b1b; }
    .info { display: block !important; background: #dbeafe; color: #1e40af; }

    .manual {
      margin-top: 24px;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .small { font-size: 13px; color: #6b7280; }

    /* Popup overlay */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup-overlay.show {
      display: flex;
    }

    .popup {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px 24px;
      text-align: center;
      box-shadow: 0 15px 45px #0004;
      animation: popupIn 0.25s ease-out;
    }

    @keyframes popupIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .popup-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
    }

    .popup-icon.success {
      background: #dcfce7;
      color: #16a34a;
    }

    .popup-icon.error {
      background: #fee2e2;
      color: #dc2626;
    }

    .popup-icon.warning {
      background: #fef3c7;
      color: #d97706;
    }

    .popup h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .popup-description {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .participant-details {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
      margin: 16px 0;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .detail-label {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail-value {
      color: #111827;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .detail-value:last-child { margin-bottom: 0; }

    .popup-button {
      margin: 8px 0 0;
      padding: 14px;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 16px;
    }

    .popup-button.error-button { background: #dc2626; }
    .popup-button.warning-button { background: #d97706; }
  </style>
</head>

<body>
  <main class="card">
    <h1>UNDER 25</h1>
    <div class="subtitle">QR Attendance Scanner</div>

    <input
      id="operator"
      placeholder="Enter check-in operator name"
      autocomplete="name"
    >

    <div id="reader"></div>

    <button id="start" onclick="startCamera()">Start Camera</button>
    <button id="stop" class="secondary" onclick="stopCamera()" disabled>
      Stop Camera
    </button>

    <div id="message"></div>

    <div class="manual">
      <b>Manual Check-in</b>
      <input id="manualId" placeholder="Enter registration ID">
      <button id="manualButton" onclick="manualCheckIn()">Check In</button>
    </div>

    <p class="small">Camera access requires HTTPS and permission.</p>
  </main>

  <!-- Attendance result popup -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div id="popupIcon" class="popup-icon success">✓</div>
      <h2 id="popupTitle">Attendance Successful!</h2>
      <div id="popupDescription" class="popup-description">
        Participant checked in successfully.
      </div>
      <div id="popupDetails" class="participant-details"></div>
      <button id="popupButton" class="popup-button" onclick="closePopup()">
        OK
      </button>
    </div>
  </div>

  <script>
    // Cloudflare Worker URL
    const API_URL =
      "https://u25-attendance-api.rahilkalyanker99.workers.dev/";

    let scanner = null;
    let running = false;
    let busy = false;
    let popupOpen = false;
    let lastScan = "";
    let lastScanAt = 0;
    let requestTimeout = null;

    function message(text, type) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = type;
    }

    function showPopup(type, title, description, details = []) {
      const overlay = document.getElementById("popupOverlay");
      const icon = document.getElementById("popupIcon");
      const button = document.getElementById("popupButton");
      const detailsBox = document.getElementById("popupDetails");

      popupOpen = true;

      icon.className = "popup-icon " + type;
      icon.textContent =
        type === "success" ? "✓" :
        type === "warning" ? "!" : "×";

      document.getElementById("popupTitle").textContent = title;
      document.getElementById("popupDescription").textContent = description;

      detailsBox.replaceChildren();

      details.forEach(item => {
        const label = document.createElement("div");
        label.className = "detail-label";
        label.textContent = item.label;

        const value = document.createElement("div");
        value.className = "detail-value";
        value.textContent = item.value;

        detailsBox.append(label, value);
      });

      detailsBox.style.display = details.length ? "block" : "none";

      button.className = "popup-button";
      if (type === "error") button.classList.add("error-button");
      if (type === "warning") button.classList.add("warning-button");

      overlay.classList.add("show");
      button.focus();
    }

    function closePopup() {
      document.getElementById("popupOverlay").classList.remove("show");
      popupOpen = false;
    }

    async function startCamera() {
      if (running || busy) return;

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        message(
          "Camera access requires a secure HTTPS page and a supported browser.",
          "error"
        );
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        message(
          "QR library failed to load. Check your internet connection.",
          "error"
        );
        return;
      }

      document.getElementById("start").disabled = true;
      message("Starting camera...", "info");

      try {
        scanner = new Html5Qrcode("reader");
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras.length) {
          throw new Error("No camera found.");
        }

        const camera =
          cameras.find(c => /back|rear|environment/i.test(c.label)) ||
          cameras[0];

        await scanner.start(
          camera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScan,
          () => {}
        );

        running = true;
        document.getElementById("stop").disabled = false;
        message("Camera started. Scan a participant QR code.", "success");

      } catch (err) {
        message(
          "Camera error: " + (err.message || String(err)),
          "error"
        );

        document.getElementById("start").disabled = false;

        if (scanner) {
          try {
            await scanner.clear();
          } catch (_) {}

          scanner = null;
        }
      }
    }

    async function stopCamera() {
      if (!scanner || !running) return;

      try {
        await scanner.stop();
        await scanner.clear();

        scanner = null;
        running = false;

        document.getElementById("start").disabled = false;
        document.getElementById("stop").disabled = true;

        message("Camera stopped.", "info");

      } catch (err) {
        message("Could not stop camera: " + err.message, "error");
      }
    }

    function onScan(decodedText) {
      const now = Date.now();

      if (
        busy ||
        popupOpen ||
        (decodedText === lastScan && now - lastScanAt < 5000)
      ) {
        return;
      }

      lastScan = decodedText.trim();
      lastScanAt = now;

      submitAttendance(lastScan);
    }

    function manualCheckIn() {
      const id = document.getElementById("manualId").value.trim();

      if (!id) {
        message("Enter a registration ID.", "error");
        return;
      }

      submitAttendance(id);
    }

    function finishAttendanceRequest() {
      busy = false;
      document.getElementById("manualButton").disabled = false;

      if (requestTimeout !== null) {
        clearTimeout(requestTimeout);
        requestTimeout = null;
      }
    }

    function handleAttendanceResponse(payload) {
      finishAttendanceRequest();

      if (payload && payload.success) {
        const when = payload.checkInTime
          ? new Date(payload.checkInTime).toLocaleString()
          : "Not provided";

        message("Attendance recorded successfully.", "success");

        showPopup(
          "success",
          "Attendance Successful!",
          "The participant has been checked in successfully.",
          [
            {
              label: "Participant Name",
              value: payload.name || "Participant"
            },
            {
              label: "Registration ID",
              value: payload.registrationId || ""
            },
            {
              label: "Check-in Time",
              value: when
            }
          ]
        );
      } else {
        const errorMessage =
          (payload && payload.message) ||
          "Attendance could not be recorded.";

        const duplicate = /already|duplicate|checked.?in/i.test(errorMessage);

        message(errorMessage, "error");

        showPopup(
          duplicate ? "warning" : "error",
          duplicate ? "Already Checked In!" : "Attendance Failed",
          errorMessage
        );
      }
    }

    async function submitAttendance(id) {
      if (busy || popupOpen) return;

      const operator =
        document.getElementById("operator").value.trim();

      if (!operator) {
        message("Enter the check-in operator name first.", "error");
        showPopup(
          "error",
          "Operator Name Required",
          "Please enter the check-in operator name before scanning."
        );
        return;
      }

      if (!id) {
        message("Registration ID is empty.", "error");
        showPopup("error", "Invalid QR Code", "Registration ID is empty.");
        return;
      }

      busy = true;
      document.getElementById("manualButton").disabled = true;
      message("Sending attendance request...", "info");

      requestTimeout = setTimeout(() => {
        finishAttendanceRequest();
        message(
          "The server did not respond in time. Check the Attendance sheet before retrying.",
          "error"
        );
        showPopup(
          "warning",
          "Request Timed Out",
          "The server did not respond in time. Please check the Attendance sheet before retrying."
        );
      }, 20000);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "recordAttendance",
            registrationId: id,
            checkedInBy: operator
          })
        });

        const responseText = await response.text();

        let payload;

        try {
          payload = JSON.parse(responseText);
        } catch (_) {
          throw new Error(
            "The server returned an invalid response. Check the Worker and Apps Script."
          );
        }

        // Ignore a late response after the timeout.
        if (!busy) return;

        handleAttendanceResponse(payload);

      } catch (err) {
        if (!busy) return;

        finishAttendanceRequest();

        const errorMessage =
          "Could not reach the attendance server. " +
          (err.message || "Please try again.");

        message(errorMessage, "error");
        showPopup("error", "Connection Error", errorMessage);
      }
    }

    document.getElementById("popupOverlay").addEventListener("click", event => {
      if (event.target.id === "popupOverlay") {
        closePopup();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && popupOpen) {
        closePopup();
      }
    });
  </script>
</body>
</html>
