
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under 25 | Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .card {
      max-width: 480px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0002;
      text-align: center;
    }

    h1 { margin: 5px 0; }
    .subtitle { color: #6b7280; margin-bottom: 20px; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input { border: 1px solid #d1d5db; }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { background: #9ca3af; }
    .secondary { background: #4b5563; }

    #reader { width: 100%; margin: 15px auto; }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success { display: block !important; background: #dcfce7; color: #166534; }
    .error { display: block !important; background: #fee2e2; color: #991b1b; }
    .info { display: block !important; background: #dbeafe; color: #1e40af; }

    .manual {
      margin-top: 24px;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .small { font-size: 13px; color: #6b7280; }
  </style>
</head>

<body>
  <main class="card">
    <h1>UNDER 25</h1>
    <div class="subtitle">QR Attendance Scanner</div>

    <input
      id="operator"
      placeholder="Enter check-in operator name"
      autocomplete="name"
    >

    <div id="reader"></div>

    <button id="start" onclick="startCamera()">Start Camera</button>
    <button id="stop" class="secondary" onclick="stopCamera()" disabled>
      Stop Camera
    </button>

    <div id="message"></div>

    <div class="manual">
      <b>Manual Check-in</b>
      <input id="manualId" placeholder="Enter registration ID">
      <button id="manualButton" onclick="manualCheckIn()">Check In</button>
    </div>

    <p class="small">Camera access requires HTTPS and permission.</p>
  </main>

  <script>
    // Cloudflare Worker URL
    const API_URL =
      "https://u25-attendance-api.rahilkalyanker99.workers.dev/";

    let scanner = null;
    let running = false;
    let busy = false;
    let lastScan = "";
    let lastScanAt = 0;
    let requestTimeout = null;

    function message(text, type) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = type;
    }

    async function startCamera() {
      if (running || busy) return;

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        message(
          "Camera access requires a secure HTTPS page and a supported browser.",
          "error"
        );
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        message(
          "QR library failed to load. Check your internet connection.",
          "error"
        );
        return;
      }

      document.getElementById("start").disabled = true;
      message("Starting camera...", "info");

      try {
        scanner = new Html5Qrcode("reader");
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras.length) {
          throw new Error("No camera found.");
        }

        const camera =
          cameras.find(c => /back|rear|environment/i.test(c.label)) ||
          cameras[0];

        await scanner.start(
          camera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScan,
          () => {}
        );

        running = true;
        document.getElementById("stop").disabled = false;
        message("Camera started. Scan a participant QR code.", "success");

      } catch (err) {
        message(
          "Camera error: " + (err.message || String(err)),
          "error"
        );

        document.getElementById("start").disabled = false;

        if (scanner) {
          try {
            await scanner.clear();
          } catch (_) {}

          scanner = null;
        }
      }
    }

    async function stopCamera() {
      if (!scanner || !running) return;

      try {
        await scanner.stop();
        await scanner.clear();

        scanner = null;
        running = false;

        document.getElementById("start").disabled = false;
        document.getElementById("stop").disabled = true;

        message("Camera stopped.", "info");

      } catch (err) {
        message("Could not stop camera: " + err.message, "error");
      }
    }

    function onScan(decodedText) {
      const now = Date.now();

      if (
        busy ||
        (decodedText === lastScan && now - lastScanAt < 5000)
      ) {
        return;
      }

      lastScan = decodedText.trim();
      lastScanAt = now;

      submitAttendance(lastScan);
    }

    function manualCheckIn() {
      const id = document.getElementById("manualId").value.trim();

      if (!id) {
        message("Enter a registration ID.", "error");
        return;
      }

      submitAttendance(id);
    }

    function finishAttendanceRequest() {
      busy = false;

      document.getElementById("manualButton").disabled = false;

      if (requestTimeout !== null) {
        clearTimeout(requestTimeout);
        requestTimeout = null;
      }
    }

    function handleAttendanceResponse(payload) {
      finishAttendanceRequest();

      if (payload && payload.success) {
        const when = payload.checkInTime
          ? new Date(payload.checkInTime).toLocaleString()
          : "";

        message(
          "SUCCESS: " + (payload.name || "Participant") +
          " checked in.\nRegistration ID: " +
          (payload.registrationId || "") +
          (when ? "\nTime: " + when : ""),
          "success"
        );
      } else {
        message(
          (payload && payload.message) ||
          "Attendance could not be recorded.",
          "error"
        );
      }
    }

    async function submitAttendance(id) {
      if (busy) return;

      const operator =
        document.getElementById("operator").value.trim();

      if (!operator) {
        message("Enter the check-in operator name first.", "error");
        return;
      }

      if (!id) {
        message("Registration ID is empty.", "error");
        return;
      }

      busy = true;
      document.getElementById("manualButton").disabled = true;
      message("Sending attendance request...", "info");

      requestTimeout = setTimeout(() => {
        finishAttendanceRequest();
        message(
          "The server did not respond in time. Check the Attendance sheet before retrying.",
          "error"
        );
      }, 20000);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "recordAttendance",
            registrationId: id,
            checkedInBy: operator
          })
        });

        const responseText = await response.text();

        let payload;

        try {
          payload = JSON.parse(responseText);
        } catch (_) {
          throw new Error(
            "The server returned an invalid response. Check the Worker and Apps Script."
          );
        }

        handleAttendanceResponse(payload);

      } catch (err) {
        finishAttendanceRequest();

        message(
          "Could not reach the attendance server. " +
          (err.message || "Please try again."),
          "error"
        );
      }
    }
  </script>
</body>
</html>
